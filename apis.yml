name: Braveheart Bio
description: >-
  Braveheart Bio is a late clinical-stage biopharmaceutical company developing
  novel therapeutics for hypertrophic cardiomyopathy (HCM) and related cardiac
  conditions. Its lead candidate, BHB-1893, is a selective cardiac myosin
  inhibitor (licensed as HRS-1893 from Hengrui Pharma) designed to reduce
  excessive heart-muscle contraction and improve cardiac performance in patients
  with obstructive and non-obstructive HCM. The San Francisco-based company
  launched in November 2025 with a $185M Series A led by a16z alongside Forbion,
  OrbiMed, Enavate Sciences, and Frazier Life Sciences, and filed for a Nasdaq
  IPO in July 2026. Braveheart Bio is a corporate/scientific organization and
  does not currently publish a public developer program, API, or SDKs.
